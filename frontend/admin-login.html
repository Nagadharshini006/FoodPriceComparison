<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Food Comparator</title>
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-box">
            <div class="admin-icon">🔐</div>
            <h1>Admin Panel</h1>
            <p class="subtitle">Food Price Comparator</p>
            
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="input-group">
                    <label>Admin Username</label>
                    <input type="text" id="adminUsername" placeholder="Enter admin username" required>
                </div>
                
                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                </div>
                
                <button type="submit" class="login-btn">Login to Admin Panel</button>
            </form>
            
            <div class="credentials-info">
                <p><strong>Admin Credentials:</strong></p>
                <p>Username: <code>admin</code></p>
                <p>Password: <code>admin@123</code></p>
            </div>
            
            <a href="login-simple.html" class="back-link">← Back to User Login</a>
        </div>
    </div>
    
    <script src="admin-login.js"></script>
</body>
</html>
