<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Comparator</title>
    <link rel="stylesheet" href="login-simple.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- USER / ADMIN SWITCH -->
            <div class="login-switch">
                <button type="button" class="switch-btn active" onclick="showUserLogin()">
                    User Login
                </button>

                <button type="button" class="switch-btn" onclick="showAdminLogin()">
                    Admin Login
                </button>
            </div>

            <!-- USER LOGIN -->
            <div id="userLoginSection">

                <div class="logo">🍽️</div>

                <h1>Food Price Comparator</h1>

                <p class="subtitle">
                    Login to compare food prices
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>

                <p class="demo-info">
                    Login to compare food prices
                </p>

            </div>


            <!-- ADMIN LOGIN -->
            <div id="adminLoginSection" style="display: none;">

                <div class="logo">👨‍💼</div>

                <h1>Admin Login</h1>

                <p class="subtitle">
                    Login to manage the Food Price Comparator
                </p>

                <form id="adminLoginForm">

                    <div class="input-group">
                        <input
                            type="text"
                            id="adminUsername"
                            placeholder="Enter admin username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-btn admin-btn">
                        Admin Login
                    </button>

                </form>

                <p class="demo-info">
                    Admin access only
                </p>

            </div>

        </div>

    </div>

    <script src="login-simple.js"></script>

</body>
</html>
